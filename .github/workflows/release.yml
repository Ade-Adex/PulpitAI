name: Release

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
            artifact: pulpitai-windows
          - os: macos-latest
            args: --mac
            artifact: pulpitai-macos
          - os: ubuntu-latest
            args: --linux
            artifact: pulpitai-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:renderer

      - name: Build installers
        run: npx electron-builder ${{ matrix.args }} --config electron-builder.yml --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: pulpitai-*
          merge-multiple: true

      - name: List artifacts
        run: ls -R release-artifacts

      - name: Create GitHub Release and upload installers
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          shopt -s nullglob dotglob
          FILES=(release-artifacts/*)
          echo "Uploading ${#FILES[@]} files: ${FILES[*]}"
          gh release create "$TAG_NAME" --title "PulpitAI ${TAG_NAME}" --generate-notes "${FILES[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
