appId: com.adex.pulpitai
productName: PulpitAI
copyright: Copyright (c) 2026 Adeolu Adex

directories:
  output: release

files:
  - dist/renderer/**/*
  - electron/**/*
  - package.json

# Unpack overlay assets out of app.asar so fs/readFile access is reliable
# (belt-and-suspenders alongside the fs.readFileSync serving in overlayServer).
asarUnpack:
  - electron/services/public/**/*

win:
  target:
    - nsis
    - portable
  # NSIS → per-user install by default; no admin rights needed
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup-${arch}.exe

portable:
  artifactName: ${productName}-${version}-portable-${arch}.zip

mac:
  target:
    - dmg
    - zip
  icon: build/icon.png

linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}
  maintainer: Adeolu Adex <adeoluamole@gmail.com>
  category: Utility
  synopsis: Real-time Yoruba to English sermon translator
  # NOTE: linux.desktop.entry removed — electron-builder 26.15.3 ships a broken
  # scheme.json where LinuxDesktopFile.entry/desktopActions are typed as
  # {"typeof":"function"} instead of object, so ANY desktop object fails AJV
  # validation ("should be one of these: null"). Defaults are auto-generated.

publish:
  provider: github
  owner: Ade-Adex
  repo: PulpitAI

# --- electron-builder 26.15.3 schema workaround ---
# Pinned via package.json devDependency. Do NOT re-add linux.desktop
# until upstream fixes LinuxDesktopFile.entry typing.

