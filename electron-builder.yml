appId: com.adex.pulpitai
productName: PulpitAI
copyright: Copyright (c) 2026 Adeolu Adex

directories:
  output: release

files:
  - dist/renderer/**/*
  - electron/**/*
  - package.json

extraFiles:
  - from: node_modules/ws/build/Release
    to: node_modules/ws/build/Release
    filter: ["*.node"]

win:
  target:
    - nsis
    - portable
  # NSIS → per-user install by default; no admin rights needed

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup-${arch}.exe

portable:
  artifactName: ${productName}-${version}-portable-${arch}.zip

mac:
  target:
    - dmg
    - zip

linux:
  target:
    - AppImage
    - deb
  artifactName: ${productName}-${version}-${arch}.${ext}

publish:
  provider: github
  owner: Ade-Adex
  repo: PulpitAI
